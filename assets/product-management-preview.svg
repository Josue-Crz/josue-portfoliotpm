  </g>

  <path d="M120 745 H1000" stroke="#5b467a" stroke-opacity="0.16" stroke-width="1"/>
  <rect x="278" y="760" width="564" height="18" rx="9" fill="#ffffff" opacity="0.62"/>
  <rect x="458" y="758" width="204" height="22" rx="11" fill="url(#frame)" opacity="0.88"/>
