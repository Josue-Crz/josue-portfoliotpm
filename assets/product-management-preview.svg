    <text x="24" y="40" fill="#3477a2" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">ROADMAP</text>
    <g transform="translate(24 70)">
      <rect width="132" height="96" rx="14" fill="#ffd7e6" opacity="0.98"/>
      <text x="18" y="34" fill="#21172f" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">Discover</text>
      <text x="18" y="62" fill="#21172f" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">34</text>
      <text x="60" y="62" fill="#21172f" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">signals</text>
    </g>
    <g transform="translate(174 70)">
      <rect width="132" height="96" rx="14" fill="#d8f1ff" opacity="0.98"/>
      <text x="18" y="34" fill="#1f3f5a" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">Prototype</text>
      <text x="18" y="62" fill="#1f3f5a" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">07</text>
      <text x="60" y="62" fill="#1f3f5a" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">tests</text>
    </g>
    <g transform="translate(324 70)">
      <rect width="132" height="96" rx="14" fill="#e5d9ff" opacity="0.98"/>
      <text x="18" y="34" fill="#21172f" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">Launch</text>
      <text x="18" y="62" fill="#21172f" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Q3</text>
      <text x="68" y="62" fill="#21172f" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">ready</text>
    </g>
  </g>

  <g transform="translate(142 454)">
    <rect width="420" height="214" rx="18" fill="#ffffff" opacity="0.72"/>
    <text x="24" y="40" fill="#c24e87" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">INSIGHT BOARD</text>
    <path d="M30 158 C78 94 126 126 170 96 C230 54 268 146 316 106 C348 78 376 82 398 62" fill="none" stroke="url(#peach)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="170" cy="96" r="10" fill="#93efd2"/>
    <circle cx="316" cy="106" r="10" fill="#ffc1d6"/>
    <rect x="24" y="64" width="142" height="12" rx="6" fill="#5b467a" opacity="0.14"/>
    <rect x="24" y="86" width="102" height="12" rx="6" fill="#5b467a" opacity="0.1"/>
    <rect x="244" y="150" width="126" height="28" rx="14" fill="#ffffff" opacity="0.72"/>
    <text x="266" y="169" fill="#6d6178" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">time to value</text>
  </g>

  <g transform="translate(594 454)">
    <rect width="384" height="214" rx="18" fill="#ffffff" opacity="0.72"/>
    <text x="24" y="40" fill="#3477a2" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">EXPERIMENTS</text>
    <g transform="translate(24 66)">
      <rect width="336" height="34" rx="8" fill="#5b467a" opacity="0.1"/>
      <rect width="236" height="34" rx="8" fill="url(#violet)" opacity="0.84"/>
      <text x="14" y="23" fill="#21172f" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">Research sprint</text>
