    <rect width="288" height="206" rx="18" fill="#ffffff" opacity="0.72"/>
    <text x="24" y="40" fill="#c24e87" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">OPPORTUNITY</text>
    <text x="24" y="82" fill="#21172f" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Campus tools</text>
    <text x="24" y="116" fill="#21172f" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">students trust</text>
    <rect x="24" y="144" width="104" height="16" rx="8" fill="#93efd2"/>
    <rect x="24" y="172" width="218" height="10" rx="5" fill="#5b467a" opacity="0.14"/>
    <rect x="24" y="190" width="168" height="10" rx="5" fill="#5b467a" opacity="0.1"/>
  </g>

