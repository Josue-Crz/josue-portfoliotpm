<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 820" role="img" aria-labelledby="title desc">
  <title id="title">Product management dashboard visual</title>
  <desc id="desc">A stylized product management dashboard with roadmap, insights, experiments, and launch metrics.</desc>
  <defs>
    <linearGradient id="frame" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffc1d6"/>
      <stop offset="0.5" stop-color="#8fd8ff"/>
      <stop offset="1" stop-color="#b99cff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0.05" x2="0.95" y1="0.02" y2="1">
      <stop offset="0" stop-color="#fff8fd"/>
      <stop offset="0.52" stop-color="#edf8ff"/>
      <stop offset="1" stop-color="#f8f1ff"/>
    </linearGradient>
    <linearGradient id="peach" x1="0" x2="1">
      <stop offset="0" stop-color="#ffc1d6"/>
      <stop offset="1" stop-color="#ff78ad"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#93efd2"/>
      <stop offset="0.45" stop-color="#8fd8ff"/>
      <stop offset="1" stop-color="#b99cff"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-25%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#9871b2" flood-opacity="0.28"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#5b467a" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1120" height="820" rx="32" fill="#fff7fb"/>
  <path d="M0 138 C178 88 224 10 382 0 H1120 V290 C932 328 826 276 684 332 C514 400 445 596 250 610 C120 620 54 574 0 520 Z" fill="url(#frame)" opacity="0.74"/>
  <path d="M1120 120 V820 H746 C766 712 832 662 918 624 C1016 580 1066 486 1120 388 Z" fill="#8fd8ff" opacity="0.52"/>
  <rect x="94" y="82" width="932" height="656" rx="28" fill="url(#frame)" opacity="0.64" filter="url(#softShadow)"/>
  <rect x="110" y="96" width="900" height="626" rx="22" fill="url(#screen)"/>
  <rect x="110" y="96" width="900" height="626" rx="22" fill="url(#grid)"/>

  <rect x="142" y="128" width="836" height="50" rx="13" fill="#ffffff" opacity="0.66"/>
  <circle cx="170" cy="153" r="7" fill="#ffc1d6"/>
  <circle cx="194" cy="153" r="7" fill="#8fd8ff"/>
  <circle cx="218" cy="153" r="7" fill="#93efd2"/>
  <text x="252" y="159" fill="#21172f" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Josue Cruz / Product OS</text>
  <rect x="780" y="139" width="82" height="26" rx="13" fill="#ffd7e6"/>
  <text x="802" y="158" fill="#21172f" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">Junior</text>
  <rect x="874" y="139" width="72" height="26" rx="13" fill="#ffffff" opacity="0.58"/>
  <text x="892" y="158" fill="#6d6178" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">SFSU</text>

