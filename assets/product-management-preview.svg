    <g transform="translate(24 158)">
      <rect width="336" height="34" rx="8" fill="#5b467a" opacity="0.1"/>
      <rect width="286" height="34" rx="8" fill="#93efd2" opacity="0.86"/>
      <text x="14" y="23" fill="#163326" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">Launch narrative</text>
